name: Verificações
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bussola_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: bussola-ci-disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: bussola_test
      PGPASSWORD: bussola-ci-disposable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
      # All commands are fixed literals; no event content is interpolated.
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE authenticator;'
      - run: psql -v ON_ERROR_STOP=1 -f supabase/001_bussola.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/backend.sql
      - run: BUSSOLA_RUN_DB_CONCURRENCY=1 node --test tests/backend-concurrency.mjs
