<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6255cb"><meta name="description" content="Consulte lugares, fontes e informações revisadas. Bússola, piloto público.">
  <meta name="referrer" content="no-referrer"><meta name="apple-mobile-web-app-capable" content="yes">
  <title>Bússola — lugares com contexto</title>
  <link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/vendor/fonts.css"><link rel="stylesheet" href="/vendor/leaflet.css"><link rel="stylesheet" href="/style.css">
  <script defer src="/vendor/leaflet.js"></script><script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#results" data-i18n="skip">Pular para os lugares</a>
  <header class="header">
    <a href="/" class="brand" data-aria="home"><span class="brand-symbol" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="m26 8-3 15-15 9 9-16Z" fill="currentColor"/><path d="m26 8 6 24-9-9Z" fill="currentColor" opacity=".42"/></svg></span><span>Bússola<span class="brand-caption" data-i18n="tagline">Lugares com contexto.</span></span></a>
    <nav class="navigation" data-aria="navigation"><button class="nav-item active" data-view="explore" data-i18n="explore">Explorar</button><button class="nav-item" data-view="saved"><span data-i18n="saved">Salvos</span><span id="saved-count" class="count">0</span></button></nav>
    <div class="header-actions"><button class="text-button about-trigger" data-i18n="about">Como funciona</button><button id="suggest-button" class="primary small" data-aria="suggest"><span aria-hidden="true">＋</span><span data-i18n="suggest">Sugerir lugar</span></button></div>
    <select id="language" data-aria="language"><option value="pt-BR">PT</option><option value="en-GB">EN</option></select>
  </header>
  <section class="filterbar" data-aria="filters">
    <div class="search-group"><label class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" data-placeholder="search" data-aria="search" maxlength="150" autocomplete="off"></label><label class="city-box"><select id="city" data-aria="city"><option value="São Paulo">São Paulo</option><option value="" data-i18n="allCities">Todas as cidades</option></select></label></div>
    <div class="position-filters" role="group" data-aria="positions"><button class="filter-chip selected" data-position="all" aria-pressed="true" data-i18n="all">Todos</button><button class="filter-chip" data-position="right" aria-pressed="false"><span class="dot right"></span><span data-i18n="right">Direita</span></button><button class="filter-chip" data-position="left" aria-pressed="false"><span class="dot left"></span><span data-i18n="left">Esquerda</span></button><button class="filter-chip" data-position="unknown" aria-pressed="false"><span class="dot unknown"></span><span data-i18n="unknown">Não mencionado</span></button></div>
    <button class="icon-button about-trigger" data-aria="about">ⓘ</button>
  </section>
  <main class="workspace">
    <aside class="sidebar" data-aria="listView">
      <div class="results-heading"><div class="eyeline"><span id="city-label">São Paulo</span><span class="demo-label" data-i18n="pilot">Piloto público</span></div><h1 id="view-title" data-i18n="nextPlace">Seu próximo lugar.</h1><p id="results-count" role="status"></p>
        <div class="list-controls"><label><select id="category" data-aria="category"><option value="" data-i18n="allCategories">Todas as categorias</option><option value="cafe" data-i18n="cafe">Café</option><option value="restaurant" data-i18n="restaurant">Restaurante</option><option value="bookshop" data-i18n="bookshop">Livraria</option><option value="bar" data-i18n="bar">Bar</option><option value="shop" data-i18n="shop">Loja</option><option value="other" data-i18n="other">Outro</option></select></label><select id="sort" data-aria="sort"><option value="name" data-i18n="alphabetical">Nome: A–Z</option><option value="distance" data-i18n="nearestPage">Mais próximos nesta página</option></select></div>
        <p id="sort-note" hidden data-i18n="nearestNote"></p><button id="clear-area" class="area-tag" hidden data-i18n="clearArea">Remover área do mapa</button>
        <div id="saved-tools" hidden><p data-i18n="savedNote"></p><button id="clear-saved" class="text-button" data-i18n="clearSaved">Limpar todos os salvos</button></div>
        <p id="cities-status" hidden role="status"></p><button id="cities-retry" hidden class="text-button" data-i18n="citiesRetry"></button>
        <p id="storage-status" hidden role="alert" data-i18n="storageError"></p>
      </div>
      <div id="results" class="results" tabindex="-1"></div>
      <div class="pagination"><button id="load-more" class="text-button" hidden data-i18n="loadMore">Carregar mais</button></div>
      <div class="sidebar-footer"><p><strong data-i18n="context">Contexto antes de rótulos.</strong><br><span data-i18n="footer">Cadastros publicados após revisão.</span></p><button class="icon-button about-trigger" data-aria="about">ⓘ</button></div>
    </aside>
    <section class="map-section" data-aria="map"><div id="map" data-aria="mapLabel"></div>
      <div class="map-top"><span class="map-location"><span id="map-city">São Paulo</span><span id="map-total"></span></span><button id="search-area" class="map-action" data-i18n="area">Buscar nesta área</button></div>
      <div id="map-status" class="map-status" role="status" hidden></div><div id="cluster-note" hidden class="map-demo" data-i18n="grouped"></div>
      <div class="map-controls"><button id="locate" data-aria="locate">◎</button><div class="zoom-buttons"><button id="zoom-in" data-aria="zoomIn">＋</button><button id="zoom-out" data-aria="zoomOut">−</button></div><button id="fit-map" data-aria="fit">⤢</button></div>
      <div class="map-legend"><span><i class="dot right"></i><span data-i18n="right">Direita</span></span><span><i class="dot left"></i><span data-i18n="left">Esquerda</span></span><span><i class="dot unknown"></i><span data-i18n="unknown">Não mencionado</span></span></div>
      <button id="install-button" class="install-button" data-aria="install"><span aria-hidden="true">↓</span><span data-i18n="install">Instalar app</span></button>
    </section>
  </main>
  <button id="mobile-toggle" class="mobile-toggle" data-i18n="listView">Ver lista</button>
  <div id="offline-banner" class="offline-banner" role="status" hidden data-i18n="offline"></div><div id="toast" class="toast" role="status" hidden></div>
  <dialog id="detail-dialog" aria-labelledby="detail-title"><div id="detail"></div></dialog>
  <dialog id="about-dialog" aria-labelledby="about-title"><div class="dialog-header"><span class="dialog-kicker">Bússola</span><button class="icon-button" data-close data-aria="close">×</button></div><h2 id="about-title" data-i18n="aboutTitle"></h2><p data-i18n="aboutIntro"></p><div class="note"><p data-i18n="aboutSource"></p><p data-i18n="unknownHelp"></p><p data-i18n="aboutReview"></p></div><p data-i18n="privacy"></p><p class="credit" data-i18n="credit"></p><button class="primary full" data-close data-i18n="explore"></button></dialog>
  <dialog id="suggest-dialog" aria-labelledby="suggest-title"><div class="dialog-header"><span class="dialog-kicker">Bússola</span><button class="icon-button" data-close data-aria="close">×</button></div><h2 id="suggest-title" data-i18n="suggest"></h2><p data-i18n="pendingHelp"></p>
    <form id="suggest-form"><label><span data-i18n="name"></span><input name="name" required maxlength="160" autocomplete="organization"></label><div class="form-row"><label><span data-i18n="city"></span><input name="city" required maxlength="120" autocomplete="address-level2"></label><label><span data-i18n="state"></span><input name="state" required maxlength="80" autocomplete="address-level1"></label></div><label><span data-i18n="address"></span><input name="address" required maxlength="300" autocomplete="street-address"></label><div class="form-row"><label><span data-i18n="neighbourhood"></span><input name="neighbourhood" maxlength="120"></label><label><span data-i18n="unit"></span><input name="unit" maxlength="120"></label></div><label><span data-i18n="category"></span><select name="category" data-categories></select></label><label><span data-i18n="positions"></span><select name="position" id="suggest-position"><option value="unknown" data-i18n="unknown"></option><option value="right" data-i18n="right"></option><option value="left" data-i18n="left"></option></select></label><label><span data-i18n="sourceURL"></span><input name="source_url" id="suggest-source" type="url" maxlength="2000" placeholder="https://…" aria-describedby="source-hint"></label><p id="source-hint" class="form-hint" data-i18n="sourceHelp"></p><label><span data-i18n="notes"></span><textarea name="notes" maxlength="4000" rows="4"></textarea></label><label class="honeypot" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label><label class="checkbox-label"><input type="checkbox" required><span data-i18n="acknowledge"></span></label><button class="primary full" type="submit" data-i18n="send"></button></form><p id="suggest-status" class="form-status" role="status" tabindex="-1"></p>
  </dialog>
  <dialog id="correction-dialog" aria-labelledby="correction-title"><div class="dialog-header"><span class="dialog-kicker" id="correction-place"></span><button class="icon-button" data-close data-aria="close">×</button></div><h2 id="correction-title" data-i18n="correctionTitle"></h2><p data-i18n="pendingHelp"></p><form id="correction-form"><label><span data-i18n="reason"></span><select name="reason"><option value="address" data-i18n="reason_address"></option><option value="unit" data-i18n="reason_unit"></option><option value="source" data-i18n="reason_source"></option><option value="outdated" data-i18n="reason_outdated"></option><option value="association" data-i18n="reason_association"></option><option value="other" data-i18n="reason_other"></option></select></label><label><span data-i18n="notes"></span><textarea name="notes" required maxlength="4000" rows="5"></textarea></label><label class="honeypot" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label><button class="primary full" type="submit" data-i18n="send"></button></form><p id="correction-status" class="form-status" role="status" tabindex="-1"></p></dialog>
  <dialog id="install-dialog" aria-labelledby="install-title"><div class="dialog-header"><span class="dialog-kicker">Bússola</span><button class="icon-button" data-close data-aria="close">×</button></div><h2 id="install-title" data-i18n="installTitle"></h2><p data-i18n="installIntro"></p><div class="install-step"><strong>iPhone / iPad</strong><p data-i18n="installIOS"></p></div><div class="install-step"><strong>Android / Chrome / Edge</strong><p data-i18n="installOther"></p></div><p class="note" data-i18n="installOffline"></p><button id="copy-link" class="primary full" data-i18n="copyApp"></button></dialog>
  <noscript><div class="noscript">Ative o JavaScript para explorar a Bússola. / Enable JavaScript to explore Bússola.</div></noscript>
</body></html>
